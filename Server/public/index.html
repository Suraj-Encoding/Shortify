<!-- # Shortify Server - Home Page # -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- # Website 'Title' # -->
    <title> Shortify — Modern URL Shortener </title>

    <!-- # Website 'Description' -->
    <meta name="description"
        content="Shortify is a modern, fast, and reliable URL shortener built for simplicity and performance." />
    <meta name="author" content="Suraj Dalvi" />

    <!-- # Website 'Logo' -->
    <link rel="icon" href="logo.png" />

    <!-- # 'Open Graph (OG) - Social Media' Meta Tags # -->
    <meta property="og:title" content="Shortify — Modern URL Shortener" />
    <meta property="og:description"
        content="Shortify is a modern, fast, and reliable URL shortener built for simplicity and performance." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="logo.png" />
    <meta property="og:url" content="https://myshortify.vercel.app" />

    <!-- # Style # -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f9fafb, #e5e7eb);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111827;
        }

        .container {
            text-align: center;
            padding: 2.5rem 3rem;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            width: 100%;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 0.75rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 0.95rem;
            color: #6b7280;
            margin-bottom: 1.5rem;
        }

        .badge {
            display: inline-block;
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2563eb;
            background: #eff6ff;
            border-radius: 999px;
        }
    </style>
</head>

<!-- # Body # -->

<body>
    <div class="container">
        <div class="logo">🚀</div>
        <h1> Welcome to Shortify </h1>
        <p> Modern, fast, and reliable URL shortener built for simplicity. </p>
        <span class="badge"> API is running successfully </span>
    </div>
</body>

</html>
