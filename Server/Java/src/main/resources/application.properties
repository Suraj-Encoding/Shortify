# Server Configuration
server.port=${PORT:3001}

# MongoDB Configuration  
spring.data.mongodb.uri=${MONGO_URI:mongodb+srv://encoding:Encoding116@cluster-0.pekhurp.mongodb.net/shortify}
spring.data.mongodb.database=${DB_NAME:shortify}

# Application Configuration
